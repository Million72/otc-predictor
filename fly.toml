app = "otc-predictor"
primary_region = "iad"

[build]
  dockerfile = "deploy/Dockerfile"

[env]
  # DERIV_API_TOKEN is set via `fly secrets set`, not here.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "otc_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
